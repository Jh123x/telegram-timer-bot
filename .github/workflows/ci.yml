# Runs lint (ruff) and unit tests (pytest) on every push to main and PR to main.
name: Python CI

# Least-privilege token: read-only access to repo contents is all CI needs.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: pytest -v
